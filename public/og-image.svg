<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="150" r="300" fill="#6366f1" opacity="0.08" filter="blur(60px)"/>
  <circle cx="150" cy="500" r="250" fill="#06b6d4" opacity="0.08" filter="blur(50px)"/>
  
  <!-- Grid Lines -->
  <path d="M100 100h1000M100 200h1000M100 300h1000M100 400h1000M100 500h1000" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M200 80v480M400 80v480M600 80v480M800 80v480M1000 80v480" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Badge -->
  <rect x="120" y="110" width="310" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="144" cy="131" r="6" fill="#10b981"/>
  <text x="162" y="137" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1">NEXT-GEN SEARCH VISIBILITY</text>

  <!-- Title -->
  <text x="120" y="240" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">AI Visibility Auditor</text>
  <text x="120" y="320" fill="url(#accent)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800">SEO • AEO • AIO • GEO • E-E-A-T</text>

  <!-- Description -->
  <text x="120" y="390" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">Deep website crawling, AI search engine benchmarking, and curriculum science solutions.</text>
  <text x="120" y="425" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="20">Verified for Google, ChatGPT Search, Perplexity, Claude, and Enterprise Knowledge Graphs.</text>

  <!-- Metric Badges -->
  <g transform="translate(120, 480)">
    <rect width="180" height="70" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="800">95%+</text>
    <text x="24" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AUDIT SCORE</text>
  </g>
  <g transform="translate(320, 480)">
    <rect width="180" height="70" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="35" fill="#10b981" font-family="system-ui, sans-serif" font-size="28" font-weight="800">5-Pillar</text>
    <text x="24" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AI OPTIMIZATION</text>
  </g>
  <g transform="translate(520, 480)">
    <rect width="180" height="70" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="35" fill="#c084fc" font-family="system-ui, sans-serif" font-size="28" font-weight="800">100%</text>
    <text x="24" y="55" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600">FREE SCIENTIFIC</text>
  </g>
